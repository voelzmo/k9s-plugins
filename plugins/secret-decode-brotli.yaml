# Decode brotli-compressed entries of a Secret and show their content.
#
# Brotli has no magic bytes, so detection works by attempting to decompress
# every entry: the ones that decompress cleanly are shown, all others are
# skipped. If the decompressed content is JSON it is pretty-printed.
#
# Requires: kubectl, jq, brotli, less
secret-decode-brotli:
  shortCut: Shift-B
  confirm: false
  description: Decode brotli-compressed data in secret
  scopes:
    - secrets
  command: bash
  background: false
  args:
    - -c
    - |
      kubectl get secret --context "$CONTEXT" -n "$NAMESPACE" "$NAME" -o json \
        | jq -r '.data // {} | to_entries[] | "\(.key)\t\(.value)"' \
        | while IFS=$'\t' read -r k v; do
            tmp=$(mktemp)
            if echo "$v" | base64 -d | brotli -dc > "$tmp" 2>/dev/null && [ -s "$tmp" ]; then
              echo "=== $k (brotli)"
              jq . "$tmp" 2>/dev/null || cat "$tmp"
              echo
            fi
            rm -f "$tmp"
          done 2>&1 | less
