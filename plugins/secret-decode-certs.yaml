# Decode all certificates contained in a Secret.
#
# Shows subject, issuer, validity and SANs for every certificate in the secret.
# Bundles with several certificates are split and shown one by one.
#
# Requires: kubectl, jq, awk, openssl (>= 1.1.1, for `x509 -ext`), less
secret-decode-certs:
  shortCut: Shift-C
  confirm: false
  description: Decode all certs in secret
  scopes:
    - secrets
  command: bash
  background: false
  args:
    - -c
    - |
      kubectl get secret --context "$CONTEXT" -n "$NAMESPACE" "$NAME" -o json \
        | jq -r '.data // {} | to_entries[] | "\(.key)\t\(.value)"' \
        | while IFS=$'\t' read -r k v; do
            echo "$v" | base64 -d | grep -q 'BEGIN CERTIFICATE' || continue
            echo "=== $k"
            echo "$v" | base64 -d | awk '
              /-----BEGIN CERTIFICATE-----/ {
                n++; print "--- certificate " n; fflush()
                cmd = "openssl x509 -noout -subject -issuer -dates -ext subjectAltName 2>&1"
              }
              cmd { print | cmd }
              /-----END CERTIFICATE-----/ { close(cmd); cmd = "" }
            '
          done 2>&1 | less
